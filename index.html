<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VMS Procurement · RSUD HAMBA</title>
  <meta name="description" content="Vendor Management System RSUD HAMBA — PO, Approval PPK, BAST, Invoice & Pembayaran BLUD">
  <meta name="theme-color" content="#1B4F72">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B4F72'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Layar muat awal (hanya tampil < 1 detik; setelah itu cache lokal dipakai) -->
  <div id="boot" class="boot"><div class="center"><div class="sp"></div><div class="mono small muted">Memuat VMS Procurement…</div></div></div>

  <!-- Halaman login -->
  <div id="login-root" class="hidden"></div>

  <!-- Aplikasi (SPA) -->
  <div id="app" class="app hidden">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <div class="brand-logo"><svg viewBox="0 0 32 32" width="30" height="30"><path d="M12 3h8v9h9v8h-9v9h-8v-9H3v-8h9z" fill="#fff"/><path d="M26 2l1.2 2.8L30 6l-2.8 1.2L26 10l-1.2-2.8L22 6l2.8-1.2z" fill="#94f4ad"/></svg></div>
        <div><small data-rs>RSUD HAMBA</small><b>VMS Procurement</b></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#94f4ad" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg> SIK-Kemkes Ready · v1.0</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamb" id="hamb" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="crumb"><span id="crumb-rs">RSUD HAMBA</span> &nbsp;›&nbsp; <span>Pengadaan &amp; Logistik</span></div>
        <div class="gsearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="gs-in" type="search" placeholder="Cari PO, Vendor, No BAST…  (Ctrl+K)" autocomplete="off" aria-label="Pencarian global">
          <div id="gs-res" class="gs-results hidden"></div>
        </div>
        <span class="spacer"></span>
        <div id="conn" class="conn"><i></i><span>GAS Database Connected</span></div>
        <button class="bell" id="bell" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot hidden" id="bell-dot">0</span></button>
        <button class="me" id="me" aria-label="Akun saya">
          <span class="av"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
          <div><b id="me-name">-</b><small id="me-role">-</small></div>
        </button>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages-utama.js"></script>
  <script src="js/pages-transaksi.js"></script>
  <script src="js/pages-admin.js"></script>
</body>
</html>
